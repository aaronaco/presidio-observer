[project]
name = "presidio-observer-backend"
version = "0.1.0"
description = "Backend for Presidio Observer"
authors = [
    {name = "your name", email = "you@email.com"}
]
readme = "README.md"
requires-python = "^3.9"
dependencies = [
    "fastapi (==0.128.8)",
    "uvicorn (==0.39.0)",
    "sqlalchemy (>=2.0.0,<3.0.0)",
    "pydantic (>=2.0.0,<3.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
